<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0f0f0f">
<title>Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#e8e8e8;--text2:#9a9a9a;--text3:#626262;
  --accent:#c8f060;--accent2:#a0d040;
  --danger:#ff5a5a;--success:#4caf7d;--warn:#f0b050;
  --up:#4caf7d;--dn:#ff5a5a;--eq:#777;
  --r:10px;--rs:6px;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,sans-serif;-webkit-text-size-adjust:100%;}
body{max-width:480px;margin:0 auto;padding-bottom:150px;background:var(--bg);}
button{font-family:inherit;}

header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20;}
.logo{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent);}
.htime{font-size:12px;color:var(--text2);font-family:var(--mono);}

.nav{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
.nav::-webkit-scrollbar{display:none;}
.nb{flex-shrink:0;padding:10px 16px;font-size:12px;font-family:var(--mono);cursor:pointer;border:none;background:transparent;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.nb.active{color:var(--accent);border-bottom-color:var(--accent);}

.page{display:none;padding:16px;}.page.active{display:block;}

.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.chip{font-size:12px;font-family:var(--mono);padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);white-space:nowrap;}
.chip.on{background:rgba(200,240,96,.12);color:var(--accent);border-color:rgba(200,240,96,.3);}
.chip.dim{color:var(--text3);}

.drow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.dlbl{font-size:12px;color:var(--text2);font-family:var(--mono);}
.dinp{font-size:13px;font-family:var(--mono);padding:5px 8px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg2);color:var(--text);}

.banner{background:rgba(240,176,80,.08);border:1px solid rgba(240,176,80,.3);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.4;}

/* groups (supersets / circuits) */
.grp{border-left:2px solid rgba(200,240,96,.35);padding-left:8px;margin-bottom:12px;}
.grp-h{font-size:11px;font-family:var(--mono);color:var(--accent);margin:2px 0 8px;line-height:1.45;}
.grp-h span{color:var(--text3);}

/* exercise card */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;position:relative;}
.grp .card{margin-bottom:8px;}
.ss-card{border:1px solid var(--border2);border-radius:var(--r);margin-bottom:10px;}
.ss-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;}
.ss-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.ss-body{padding:12px;}
.ss-ex+.ss-ex{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.ss-ex-name{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;}

.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;}
.cn{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;line-height:1.3;}
.gtag{font-size:10px;font-family:var(--mono);color:#0f0f0f;background:var(--accent);border-radius:4px;padding:1px 5px;font-weight:500;}
.ca{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px;background:rgba(200,240,96,.1);color:var(--accent);border:1px solid rgba(200,240,96,.2);white-space:nowrap;}
.bxs{font-size:11px;font-family:var(--mono);padding:4px 9px;border-radius:var(--rs);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);white-space:nowrap;}
.bxs:active{background:var(--bg3);}
.bxs.on{color:var(--accent);border-color:rgba(200,240,96,.3);background:rgba(200,240,96,.08);}
.binfo{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:6px;}

.vchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.vchip{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:14px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;}
.vchip.on{color:var(--text);border-color:var(--text2);background:var(--bg3);}

.info{font-size:11.5px;font-family:var(--mono);line-height:1.5;margin-bottom:3px;color:var(--text2);}
.info b{font-weight:500;color:var(--text3);}
.info.hint{color:var(--text2);}
.info.hint.up{color:var(--accent);}
.info.hint.warn{color:var(--warn);}
.info.mynote{color:var(--warn);font-family:'IBM Plex Sans',sans-serif;font-size:12px;}
.infos{margin-bottom:8px;}

.sh,.sr{display:grid;grid-template-columns:30px 1fr 1fr 42px 20px;gap:5px;align-items:center;}
.sh{margin-bottom:4px;}
.sh span{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:center;}
.sr{margin-bottom:5px;}
.sn{font-size:12px;color:var(--text3);font-family:var(--mono);text-align:center;background:transparent;border:1px dashed transparent;border-radius:var(--rs);padding:7px 0;cursor:pointer;}
.sn:active{border-color:var(--border2);}
.sr.wu .sn{color:var(--warn);border-color:rgba(240,176,80,.35);}
.si{width:100%;font-size:15px;font-family:var(--mono);padding:7px 4px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg3);color:var(--text);text-align:center;-webkit-appearance:none;appearance:none;}
.si::placeholder{color:#555;}
.si:focus{outline:none;border-color:var(--text3);}
select.si{font-size:13px;padding:8px 2px;text-align-last:center;}
.sr.wu .si{border-style:dashed;color:var(--text2);}
.sr.done .si{border-color:rgba(76,175,125,.55);}
.ok{height:34px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:15px;cursor:pointer;}
.ok.on{background:var(--success);border-color:var(--success);color:#0f0f0f;}
.ds{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;padding:0;}
.ds:active{color:var(--danger);}
.addrow{display:flex;gap:6px;margin-top:6px;}

.vbl{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.vr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.vlbl{font-size:11px;color:var(--text3);font-family:var(--mono);}
.vval{font-size:12px;font-family:var(--mono);color:var(--text2);}
.vd{font-size:11px;font-family:var(--mono);}
.vd.up{color:var(--up);}.vd.dn{color:var(--dn);}.vd.eq{color:var(--eq);}

.hbl{margin-top:6px;}
.htog{display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:4px 0;color:var(--text3);font-size:11px;font-family:var(--mono);}
.harr{font-size:9px;transition:transform .2s;}.harr.open{transform:rotate(90deg);}
.hlist{margin-top:6px;}
.he{background:var(--bg3);border-radius:var(--rs);padding:7px 10px;margin-bottom:5px;}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.hdate2{font-size:11px;color:var(--text3);font-family:var(--mono);}
.hm{display:flex;align-items:center;gap:6px;}
.hv{font-size:11px;font-family:var(--mono);color:var(--text2);}
.hs{font-size:11px;font-family:var(--mono);color:var(--text2);line-height:1.7;}
.hs i{color:var(--warn);font-style:normal;}
.sk{color:var(--text3);font-style:italic;font-size:12px;}
.dh{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0 2px;line-height:1;}
.eh{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:11px;font-family:var(--mono);padding:0 4px;text-decoration:underline;text-underline-offset:2px;}
.mbtn{font-size:11px;font-family:var(--mono);color:var(--text3);cursor:pointer;background:none;border:none;padding:2px 0;text-decoration:underline;text-underline-offset:2px;}

/* technique panel */
.tech{background:var(--bg3);border-radius:var(--rs);padding:10px;margin:4px 0 10px;}
.timg{position:relative;border-radius:var(--rs);overflow:hidden;margin-bottom:10px;background:#0b0b0b;height:210px;}
.timg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
.timg img.f2{animation:flip 2.4s steps(1,end) infinite;}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.tsec{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 5px;}
.tp{font-size:13px;line-height:1.5;color:var(--text);}
.tp b{font-weight:500;color:var(--accent);}
.tl{padding-left:18px;font-size:13px;line-height:1.5;color:var(--text);}
.tl li{margin-bottom:4px;}
.tl.err li::marker{color:var(--danger);}
.tarea{width:100%;min-height:54px;font-size:13px;font-family:inherit;padding:8px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg2);color:var(--text);resize:vertical;}
.tarea:focus{outline:none;border-color:var(--text3);}
.tsrc{font-size:10px;color:var(--text3);margin-top:8px;}

/* total */
.total-row{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap;}
.total-item{font-size:12px;font-family:var(--mono);color:var(--text2);}
.total-item span{color:var(--accent);}
.daynote{margin-top:10px;}

/* settings */
.ss-sec{margin-bottom:24px;}
.st{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
.slbl{font-size:13px;}.ssub{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4;}
.sinp{width:90px;font-size:13px;font-family:var(--mono);padding:5px 8px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg2);color:var(--text);text-align:right;}
.sinp.wide{width:160px;text-align:left;}
.sinp:focus{outline:none;border-color:var(--accent);}
.editor{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:12px;}
.einp{width:100%;font-size:13px;font-family:var(--mono);padding:7px 10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg3);color:var(--text);margin-bottom:8px;}
.einp:focus{outline:none;border-color:var(--accent);}
.esel{width:100%;font-size:13px;font-family:var(--mono);padding:6px 8px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg3);color:var(--text);margin-bottom:8px;}
.flags{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap;}
.flags label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);cursor:pointer;}
.flags input[type=checkbox]{accent-color:var(--accent);}
.ecr{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rs);}
.ecl{font-size:12px;color:var(--text2);flex:1;}
.note{font-size:11px;color:var(--text3);font-family:var(--mono);margin:4px 0 8px;line-height:1.5;}
.br{display:flex;gap:8px;flex-wrap:wrap;}
.ba{font-size:12px;font-family:var(--mono);padding:7px 14px;border-radius:var(--rs);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);}
.ba:active{background:var(--bg3);}
.ba.primary{background:var(--accent);color:#0f0f0f;border-color:transparent;font-weight:500;}
.ba.danger{color:var(--danger);border-color:rgba(255,90,90,.35);}
.ba.ghost{color:var(--text3);}
.ba.sm{padding:4px 10px;font-size:11px;}
.pitem{padding:8px;border-radius:var(--rs);background:var(--bg3);margin-bottom:6px;}
.pitem-top{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:6px;}
.pitem-f{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--text3);font-family:var(--mono);}
.pin{width:44px;font-size:12px;font-family:var(--mono);padding:3px 4px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg2);color:var(--text);text-align:center;}
.mv{background:transparent;border:1px solid var(--border2);border-radius:var(--rs);color:var(--text2);font-size:12px;padding:1px 7px;cursor:pointer;}

/* data page */
.expbtn{display:block;width:100%;padding:12px 14px;font-size:13px;font-family:var(--mono);border-radius:var(--r);cursor:pointer;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);text-align:left;margin-bottom:8px;}
.expbtn.primary{border-color:rgba(200,240,96,.4);color:var(--accent);}
.expbtn:active{background:var(--bg3);}
.expnote{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.55;}
.expnote b{color:var(--text2);font-weight:500;}
.okline{color:var(--success);}.warnline{color:var(--warn);}
.exp-preview{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-top:12px;}

/* bottom */
.bbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:480px;margin:0 auto;z-index:30;}
.bm{flex:1;padding:12px;font-size:13px;font-family:var(--mono);border-radius:var(--r);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);}
.bm.primary{background:var(--accent);color:#0f0f0f;border-color:transparent;font-weight:500;flex:2;}

/* rest timer */
.tbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;padding:0 16px 8px;z-index:31;display:none;}
.tbox{position:relative;overflow:hidden;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);display:flex;align-items:center;gap:8px;padding:8px 10px;}
.tfill{position:absolute;left:0;top:0;bottom:0;background:rgba(200,240,96,.10);transition:width .25s linear;}
.ttxt{position:relative;flex:1;font-family:var(--mono);font-size:13px;color:var(--text);}
.ttxt small{color:var(--text3);font-size:11px;}
.tbtn{position:relative;font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;}
.tbox.end{background:var(--accent);border-color:var(--accent);animation:pulse .6s ease-in-out 4;}
.tbox.end .ttxt{color:#0f0f0f;font-weight:500;}
@keyframes pulse{50%{opacity:.55}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:20px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:500;margin-bottom:8px;}
.modal-text{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.55;white-space:pre-line;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;}
.mrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;white-space:normal;}
.mrow input[type=number],.mrow select{width:72px;font-family:var(--mono);padding:5px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg3);color:var(--text);font-size:14px;text-align:center;}
.mrow label{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:3px;}

.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-size:12px;font-family:var(--mono);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <div class="logo">GYM_TRACKER</div>
  <div class="htime" id="htime"></div>
</header>
<div class="nav">
  <button class="nb active" onclick="showPage('workout')">тренировка</button>
  <button class="nb" onclick="showPage('settings')">настройки</button>
  <button class="nb" onclick="showPage('data')">данные</button>
</div>
<div id="pg-workout" class="page active"></div>
<div id="pg-settings" class="page"></div>
<div id="pg-data" class="page"></div>
<div class="tbar" id="tbar"><div class="tbox" id="tbox"><div class="tfill" id="tfill"></div><div class="ttxt" id="ttxt"></div><button class="tbtn" onclick="addRest(30)">+30с</button><button class="tbtn" onclick="stopRest()">✕</button></div></div>
<div class="bbar" id="bbar">
  <button class="bm" onclick="askClearDay()">Очистить</button>
  <button class="bm primary" onclick="saveDay()">Сохранить тренировку</button>
</div>
<input type="file" id="restore-inp" accept=".json,application/json,text/plain" style="display:none" onchange="onRestoreFile(this)">
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="ex-images.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
//  GYM TRACKER v12 — всё хранится только на телефоне (localStorage).
//  Старые данные (ключ gym_v11) подхватываются автоматически и не удаляются.
// ════════════════════════════════════════════════════════════════════════════
const LS_KEY="gym_v12", LS_OLD="gym_v11", LS_DEF="gym_v12_defaults";
// Старая Google-таблица — только для однократного импорта в разделе «данные».
const GS="https://script.google.com/macros/s/AKfycbzBrKu5a8Ipuuix4UAi6zau51NCR0QgMTcKhKwKUhl-Ww382UtQ3WTwGmDr7m-AKGRa7g/exec";

// ── упражнения ───────────────────────────────────────────────────────────────
// defaultUnit: кг|ф|повт|сек · hasBar: вес грифа из настроек · bodyweight: база = вес тела
// usesBand: вместо ±кг выбирается резинка · inc: шаг прибавки веса (кг) · start: стартовый вес
const EX_DEFS=[
  {id:"hack",name:"Гак-присед",defaultUnit:"кг",inc:5,start:"~125–130 кг",note:"Против тошноты: 6–10 повторов, отдых 3 мин, между подходами ходить, воду пить маленькими глотками."},
  {id:"chest_press",name:"Жим штанги лёжа",defaultUnit:"кг",hasBar:true,inc:2.5,start:"40 кг вместе с грифом — первые недели техника"},
  {id:"pullups",name:"Подтягивания",defaultUnit:"кг",bodyweight:true,usesBand:true,start:"без резинки; если выходит меньше 6 — с резинкой"},
  {id:"db_ohp",name:"Жим гантелей сидя",defaultUnit:"кг",inc:2,start:"10 кг"},
  {id:"leg_curl",name:"Сгибание ног",defaultUnit:"кг",inc:5,start:"подобрать вес на 12–15 повторов"},
  {id:"laterals_ex",name:"Махи в стороны",defaultUnit:"кг",inc:1,start:"7–8 кг"},
  {id:"rdl_db",name:"Румынская тяга с гантелями",defaultUnit:"кг",inc:2,start:"14–16 кг, сначала техника"},

// ── состояние ───────────────────────────────────────────────────────────────
const clone=o=>JSON.parse(JSON.stringify(o));
function num(v){if(v===null||v===undefined)return 0;const x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x;}
function has(v){return v!==null&&v!==undefined&&String(v).trim()!=="";}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function pad(n){return String(n).padStart(2,"0");}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function ddmm(date){const p=String(date).split("-");return p.length===3?p[2]+"."+p[1]:date;}
function round05(x){return Math.round(x*2)/2;}

function freshD(){
  return{v:12,programV:1,
    settings:{bodyWeight:74,bodyHeight:192,barWeights:{chest_press:20,bicep_ez:7,tbar:15},bands:["красная"],lastBackup:null},
    exercises:clone(EX_DEFS),supersets:[],presets:clone(PROGRAM),
    workouts:{},history:{},ssHistory:{},unitPref:{},dayNotes:{}};
}

// приводит любые данные (v11, v12, файл копии) к текущему формату. Ничего не удаляет из истории.
function migrate(d){
  d=d||{};
  if(!d.settings)d.settings={};
  const s=d.settings;
  delete s.bodyFat;
  if(!s.bodyWeight)s.bodyWeight=74;
  if(!s.bodyHeight)s.bodyHeight=192;
  if(!s.barWeights)s.barWeights={};
  if(!Array.isArray(s.bands)||!s.bands.length)s.bands=["красная"];
  if(s.lastBackup===undefined)s.lastBackup=null;
  if(!Array.isArray(d.exercises))d.exercises=[];
  if(!Array.isArray(d.supersets))d.supersets=[];
  if(!d.history)d.history={};
  if(!d.ssHistory)d.ssHistory={};
  if(!d.workouts)d.workouts={};
  if(!d.unitPref)d.unitPref={};
  if(!d.dayNotes)d.dayNotes={};
  // упражнения: добавить недостающие, дополнить поля, убрать ккал
  d.exercises.forEach(e=>delete e.kcalFactor);
  EX_DEFS.forEach(def=>{
    const ex=d.exercises.find(e=>e.id===def.id);
    if(!ex){d.exercises.push(clone(def));return;}
    ["inc","start"].forEach(k=>{if(ex[k]===undefined&&def[k]!==undefined)ex[k]=def[k];});
    if(def.usesBand&&ex.usesBand===undefined)ex.usesBand=true;
    if(ex.note===undefined&&def.note)ex.note=def.note;
  });
  const ren={chest_press:["Жим грудь","Жим штанги лёжа"],bicep_ez:["Подъём на бицепс EZ","Бицепс EZ стоя"]};
  Object.keys(ren).forEach(id=>{const ex=d.exercises.find(e=>e.id===id);if(ex&&ex.name===ren[id][0])ex.name=ren[id][1];});
  d.supersets.forEach(x=>delete x.kcalFactor);
  // программа: старые пресеты откладываются (можно вернуть в настройках)
  if(!d.programV){
    if(Array.isArray(d.presets)&&d.presets.length)d.oldPresets=d.presets;
    d.presets=clone(PROGRAM);d.programV=1;
  }
  if(!Array.isArray(d.presets)||!d.presets.length)d.presets=clone(PROGRAM);
  // история по датам
  Object.keys(d.history).forEach(k=>{if(Array.isArray(d.history[k]))d.history[k].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);else delete d.history[k];});
  Object.keys(d.ssHistory).forEach(k=>{if(Array.isArray(d.ssHistory[k]))d.ssHistory[k].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);else delete d.ssHistory[k];});
  d.v=12;
  return d;
}

function loadData(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){}
  if(d&&d.exercises)return migrate(d);
  let old=null;
  try{old=JSON.parse(localStorage.getItem(LS_OLD)||"null");}catch(e){}
  if(old&&old.exercises){FIRST_MIGRATION=true;return migrate(old);}
  return migrate(freshD());
}

function pickStartPreset(){
  const byDay={1:"pA",3:"pB",5:"pF"}[new Date().getDay()];
  const ids=D.presets.map(p=>p.id);
  const active=D.presets.find(p=>{const w=D.workouts[p.id];return w&&w.started&&w.date===today();});
  if(active)return active.id;
  if(byDay&&ids.includes(byDay))return byDay;
  if(D.lastPreset&&ids.includes(D.lastPreset))return D.lastPreset;
  return ids[0]||"";
}

// ── доступ ──────────────────────────────────────────────────────────────────
function getEx(id){return D.exercises.find(e=>e.id===id);}
function getSS(id){return D.supersets.find(s=>s.id===id);}
function getPr(id){return D.presets.find(p=>p.id===id);}
function dispUnit(exId){
  const ex=getEx(exId);if(!ex)return"кг";
  const p=D.unitPref[exId];if(p==="lbs")return"ф";if(p==="kg")return"кг";
  return ex.defaultUnit||"кг";
}
function isLbs(exId){return dispUnit(exId)==="ф";}
function kgToLbs(kg){return+(kg*2.20462).toFixed(1);}
function lbsToKg(lbs){return+(lbs/2.20462).toFixed(2);}
function isRepsOnly(ex){return ex.defaultUnit==="повт"||ex.defaultUnit==="сек";}

function newSet(wu){return{weight:"",reps:"",adj:"",band:"",wu:!!wu,done:false};}
function getW(pid){
  if(!D.workouts[pid])D.workouts[pid]={date:today(),sets:{},ssSets:{},variant:{},started:null,note:""};
  const w=D.workouts[pid];
  if(!w.sets)w.sets={};if(!w.ssSets)w.ssSets={};if(!w.variant)w.variant={};if(w.note===undefined)w.note="";
  return w;
}
function workoutHasData(w){
  return Object.values(w.sets||{}).some(a=>(a||[]).some(s=>has(s.reps)||s.done))||Object.values(w.ssSets||{}).some(r=>(r||[]).some(x=>Object.values(x).some(s=>has(s.reps))));
}
function effItem(item,exId){return Object.assign({},item,(item.over||{})[exId]||{});}
function itemExId(pid,idx,item){const w=getW(pid);const v=w.variant[idx];return(v&&(v===item.id||(item.alts||[]).includes(v)))?v:item.id;}
function getSets(pid,exId,n){
  const w=getW(pid);
  if(!w.sets[exId]){
    const ex=getEx(exId);const ph=ex&&ex.usesBand?placeholders(exId,w.date).work:[];
    w.sets[exId]=[];
    for(let i=0;i<Math.max(1,n||1);i++){const ns=newSet(false);if(ph[i])ns.band=ph[i].band||"";w.sets[exId].push(ns);}
  }
  return w.sets[exId];
}
function getSSRounds(pid,ssId){
  const w=getW(pid);
  if(!w.ssSets[ssId]){const ss=getSS(ssId);const r={};(ss?.exIds||[]).forEach(id=>r[id]=newSet(false));w.ssSets[ssId]=[r];}
  return w.ssSets[ssId];
}

function baseW(exId){
  const ex=getEx(exId);if(!ex)return 0;
  if(ex.bodyweight)return num(D.settings.bodyWeight||74)*(ex.bwFactor||1);
  if(ex.hasBar)return num((D.settings.barWeights||{})[exId]);
  return 0;
}
function effW(exId,s){
  const ex=getEx(exId);if(!ex)return 0;
  const base=has(s.baseSnap)?num(s.baseSnap):baseW(exId);
  return base+(ex.bodyweight?num(s.adj):num(s.weight));
}
const isWork=s=>!s.wu&&num(s.reps)>0;
function calcVol(exId,sets){
  const ex=getEx(exId);if(!ex||!sets?.length)return 0;
  const w=(sets||[]).filter(isWork);
  if(ex.defaultUnit==="повт"||(ex.defaultUnit==="сек"&&!ex.bodyweight))return w.reduce((a,s)=>a+num(s.reps),0);
  return w.reduce((a,s)=>a+effW(exId,s)*num(s.reps),0);
}
function calcVolSS(ssId,rounds){
  const ss=getSS(ssId);if(!ss||!rounds?.length)return 0;
  return rounds.reduce((t,r)=>t+(ss.exIds||[]).reduce((a,id)=>{const s=r[id]||{};return a+effW(id,s)*num(s.reps);},0),0);
}
function fmtVol(v,ex){
  if(ex&&ex.defaultUnit==="повт")return Math.round(v)+" повт";
  if(ex&&ex.defaultUnit==="сек"&&!ex.bodyweight)return Math.round(v)+" сек";
  if(ex&&ex.defaultUnit==="сек")return Math.round(v)+" кг·с";
  return Math.round(v)+" кг·повт";
}
function getHist(exId){return D.history[exId]||[];}
function getSSHist(ssId){return D.ssHistory[ssId]||[];}
function calcPR(exId){
  const ex=getEx(exId);const h=getHist(exId);if(!ex||!h.length)return null;
  const sets=h.flatMap(e=>e.sets).filter(s=>isWork(s)&&!s.band);
  if(!sets.length)return null;
  if(isRepsOnly(ex)){const m=Math.max(...sets.map(s=>num(s.reps)));return m>0?m+(ex.defaultUnit==="сек"?" с":" повт"):null;}
  if(ex.bodyweight)return null;
  const m=Math.max(...sets.map(s=>effW(exId,s)));
  if(!(m>0))return null;
  return isLbs(exId)?Math.round(kgToLbs(m))+" ф":m+" кг";
}

// формат одного подхода
function fmtSet(exId,s){
  const ex=getEx(exId);if(!ex)return"—";
  const r=num(s.reps);if(!(r>0))return"—";
  const wu=s.wu?"<i>Р</i> ":"";
  if(ex.usesBand&&s.band)return wu+esc(s.band)+"×"+r;
  if(ex.defaultUnit==="сек")return wu+(num(s.adj)?(num(s.adj)>0?"+":"")+num(s.adj)+"кг ":"")+r+"с";
  if(ex.defaultUnit==="повт")return wu+r;
  if(ex.bodyweight){const a=num(s.adj);return wu+(a?(a>0?"+":"")+a+"кг":"свой")+"×"+r;}
  if(isLbs(exId))return wu+Math.round(kgToLbs(num(s.weight)))+"ф×"+r;
  return wu+(+effW(exId,s).toFixed(2))+"×"+r;
}
function fmtWeight(exId,total){
  const base=baseW(exId);
  if(isLbs(exId))return Math.round(kgToLbs(total))+" ф";
  if(base>0&&!getEx(exId)?.bodyweight)return total+" кг (блины "+(+(total-base).toFixed(2))+")";
  return total+" кг";
}

// ── прошлый результат и подсказка прогрессии ─────────────────────────────────
function lastEntry(exId,beforeDate){
  const h=getHist(exId).filter(e=>e.date<beforeDate&&(e.sets||[]).some(s=>num(s.reps)>0));
  return h.length?h[h.length-1]:null;
}
function progInfo(item,exId,date){
  const ex=getEx(exId);if(!ex)return{};
  const last=lastEntry(exId,date);
  if(!last){
    return{last:null,hint:ex.start?"старт: "+ex.start:"первый раз: подбери вес, чтобы оставалось 1–2 повтора в запасе",cls:""};
  }
  const ws=last.sets.filter(isWork);
  const wuN=last.sets.filter(s=>s.wu&&num(s.reps)>0).length;
  const lastStr=ddmm(last.date)+": "+(ws.length?ws.map(s=>fmtSet(exId,s)).join(" · "):"только разминка")+(wuN?` <span style="color:var(--text3)">(+${wuN} разм.)</span>`:"");
  if(!item||!item.repMax||!ws.length)return{last:lastStr,hint:null};
  const top=item.repMax,bot=item.repMin||0,n=item.sets||ws.length;
  const unitS=ex.defaultUnit==="сек"?" сек":"";
  if(ex.usesBand){
    const bands=[...new Set(ws.map(s=>s.band||""))];
    const allTop=ws.length>=n&&ws.slice(0,n).every(s=>num(s.reps)>=top);
    if(allTop)return{last:lastStr,hint:bands.some(b=>b)?"⬆ все подходы по "+top+" — пора: резинку слабее или без неё":"⬆ все подходы по "+top+" — можно добавить вес на поясе",cls:"up"};
    return{last:lastStr,hint:"цель: +1 повтор хотя бы в одном подходе"+(bands.some(b=>b)?" с той же резинкой":""),cls:""};
  }
  if(isRepsOnly(ex)||ex.bodyweight){
    const allTop=ws.length>=n&&ws.slice(0,n).every(s=>num(s.reps)>=top);
    if(allTop)return{last:lastStr,hint:"⬆ все подходы по "+top+unitS+" — пора усложнить: медленнее, пауза или сложнее вариант",cls:"up"};
    return{last:lastStr,hint:"цель: "+n+" × "+top+unitS+" — добавь повтор"+(ex.defaultUnit==="сек"?" или 5 секунд":""),cls:""};
  }
  const maxW=Math.max(...ws.map(s=>effW(exId,s)));
  const atMax=ws.filter(s=>Math.abs(effW(exId,s)-maxW)<0.01);
  const inc=num(ex.inc)||2.5;
  if(atMax.length>=n&&atMax.slice(0,n).every(s=>num(s.reps)>=top)){
    const next=round05(maxW+inc);
    return{last:lastStr,hint:"⬆ пора: "+fmtWeight(exId,next)+" — все подходы были по "+top,cls:"up"};
  }
  if(bot&&atMax.some(s=>num(s.reps)<bot))return{last:lastStr,hint:"вес тяжеловат: оставь "+fmtWeight(exId,maxW)+", пока не выйдет "+bot+"+ во всех подходах",cls:"warn"};
  return{last:lastStr,hint:"цель: "+fmtWeight(exId,maxW)+" — довести до "+n+" × "+top,cls:""};
}
function placeholders(exId,date){
  const last=lastEntry(exId,date);
  if(!last)return{work:[],wu:[]};
  return{work:last.sets.filter(isWork),wu:last.sets.filter(s=>s.wu&&num(s.reps)>0)};
}

// ── строка подхода ──────────────────────────────────────────────────────────
function setRowHTML(o){ // o:{pid,exId,i,s,ph,ssId,workNo}
  const ex=getEx(o.exId);if(!ex)return"";
  const s=o.s,ph=o.ph||{};
  const du=ex.defaultUnit||"кг";const lbs=isLbs(o.exId);
  const upd=o.ssId?`updSSSet('${o.pid}','${o.ssId}',${o.i},'${o.exId}'`:`updSet('${o.pid}','${o.exId}',${o.i}`;
  let f1="";
  if(ex.usesBand){
    const bands=D.settings.bands||[];
    const cur=s.band||"";
    f1=`<select class="si" onchange="${upd},'band',this.value)"><option value=""${cur===""?" selected":""}>без</option>${bands.map(b=>`<option value="${esc(b)}"${cur===b?" selected":""}>${esc(b)}</option>`).join("")}${cur&&!bands.includes(cur)?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:""}</select>`;
  }else if(ex.bodyweight){
    f1=`<input class="si" type="number" inputmode="decimal" step="0.5" placeholder="${has(ph.adj)?num(ph.adj):"±кг"}" value="${esc(s.adj)}" oninput="${upd},'adj',this.value)">`;
  }else if(isRepsOnly(ex)){
    f1=`<div></div>`;
  }else{
    const raw=num(s.weight);const dv=has(s.weight)?(lbs?Math.round(kgToLbs(raw)*10)/10:s.weight):"";
    const pv=has(ph.weight)?(lbs?Math.round(kgToLbs(num(ph.weight))):num(ph.weight)):(lbs?"фунты":"кг");
    f1=`<input class="si" type="number" inputmode="decimal" step="0.5" placeholder="${pv}" value="${esc(dv)}" oninput="${upd},'weight',this.value,${lbs})">`;
  }
  const rph=has(ph.reps)?num(ph.reps):(du==="сек"?"сек":"повт");
  const f2=`<input class="si" type="number" inputmode="numeric" step="1" placeholder="${rph}" value="${esc(s.reps)}" oninput="${upd},'reps',this.value)">`;
  const numLbl=s.wu?"Р":o.workNo;
  const numBtn=o.ssId?`<div class="sn">${o.i+1}</div>`:`<button class="sn" onclick="toggleWu('${o.pid}','${o.exId}',${o.i})" title="разминка">${numLbl}</button>`;
  const okFn=o.ssId?`doneSS('${o.pid}','${o.ssId}',${o.i},'${o.exId}')`:`doneSet('${o.pid}','${o.exId}',${o.i})`;
  const delFn=o.ssId?`delSSRound('${o.pid}','${o.ssId}',${o.i})`:`delSet('${o.pid}','${o.exId}',${o.i})`;
  return`<div class="sr${s.wu?" wu":""}${s.done?" done":""}">${numBtn}${f1}${f2}<button class="ok${s.done?" on":""}" onclick="${okFn}">✓</button><button class="ds" onclick="${delFn}">×</button></div>`;
}
function headHTML(ex,exId){

  const h2=ex.defaultUnit==="сек"?"сек":"повт";

function setExNote(exId,v){const ex=getEx(exId);if(!ex)return;ex.note=v;sl();}
function toggleTech(exId){techOpen[exId]=!techOpen[exId];renderWorkout();}

// ── объём и история ─────────────────────────────────────────────────────────
function volBlock(id,vol,prevVol,maxVol,ex){
  if(!(vol>0))return`<div id="vol-${id}"></div>`;
  const dl=[];
  if(prevVol>0){const d=vol-prevVol,p=Math.round(Math.abs(d)/prevVol*100);dl.push(d>0?`<span class="vd up">▲ +${p}% к прош.</span>`:d<0?`<span class="vd dn">▼ −${p}% к прош.</span>`:`<span class="vd eq">= прош.</span>`);}
  if(maxVol>0){const d2=vol-maxVol;dl.push(d2>0?`<span class="vd up">▲ рекорд объёма</span>`:`<span class="vd eq">−${Math.round(Math.abs(d2)/maxVol*100)}% к макс.</span>`);}
  return`<div id="vol-${id}" class="vbl"><div class="vr"><span class="vlbl">объём:</span><span class="vval">${fmtVol(vol,ex)}</span>${dl.join(" ")}</div></div>`;
}
function buildVol(exId,sets,date){
  const ex=getEx(exId);const vol=calcVol(exId,sets);
  const hist=getHist(exId).filter(h=>h.date<date);
  const prev=hist.length?calcVol(exId,hist[hist.length-1].sets):0;
  const maxV=hist.length?Math.max(...hist.map(h=>calcVol(exId,h.sets))):0;
  return volBlock(exId,vol,prev,maxV,ex);
}
function buildVolSS(ssId,rounds,date){
  const vol=calcVolSS(ssId,rounds);const hist=getSSHist(ssId).filter(h=>h.date<date);
  const prev=hist.length?calcVolSS(ssId,hist[hist.length-1].rounds):0;
  const maxV=hist.length?Math.max(...hist.map(h=>calcVolSS(ssId,h.rounds))):0;
  return volBlock(ssId,vol,prev,maxV,null);
}
function buildHist(exId){
  const ex=getEx(exId);if(!ex)return"";
  const hist=getHist(exId).filter(h=>(h.sets||[]).some(s=>num(s.reps)>0));
  const key="ex_"+exId,open=histOpen[key],exp=histExp[key];
  const shown=exp?hist:hist.slice(-3);
  let entries="";
  if(open){
    entries=!hist.length?`<div class="sk">пока пусто</div>`:shown.slice().reverse().map(h=>{
      const sStr=h.sets.filter(s=>num(s.reps)>0).map(s=>fmtSet(exId,s)).join(" · ")||"—";
      return`<div class="he"><div class="htop"><span class="hdate2">${h.date}</span><div class="hm"><span class="hv">${fmtVol(calcVol(exId,h.sets),ex)}</span><button class="eh" onclick="openEditHist('ex','${exId}','${h.date}')">ред.</button><button class="dh" onclick="askDelHist('ex','${exId}','${h.date}')">×</button></div></div><div class="hs">${sStr}</div></div>`;
    }).join("")+(hist.length>3&&!exp?`<button class="mbtn" onclick="histExp['${key}']=true;renderWorkout()">показать все (${hist.length})</button>`:"");
  }
  return`<div class="hbl"><button class="htog" onclick="histOpen['${key}']=!histOpen['${key}'];renderWorkout()"><span class="harr${open?" open":""}">▶</span><span>история${hist.length?` (${hist.length})`:""}</span></button>${open?`<div class="hlist">${entries}</div>`:""}</div>`;
}
function buildHistSS(ssId){
  const ss=getSS(ssId);if(!ss)return"";
  const hist=getSSHist(ssId);const key="ss_"+ssId,open=histOpen[key];
  let entries="";
  if(open)entries=!hist.length?`<div class="sk">пока пусто</div>`:hist.slice(-5).reverse().map(h=>{
    const rStr=h.rounds.map((r,i)=>`${i+1}: `+(ss.exIds||[]).map(id=>fmtSet(id,r[id]||{})).join(" + ")).join("  ");
    return`<div class="he"><div class="htop"><span class="hdate2">${h.date}</span><div class="hm"><button class="eh" onclick="openEditHist('ss','${ssId}','${h.date}')">ред.</button><button class="dh" onclick="askDelHist('ss','${ssId}','${h.date}')">×</button></div></div><div class="hs">${rStr}</div></div>`;
  }).join("");
  return`<div class="hbl"><button class="htog" onclick="histOpen['${key}']=!histOpen['${key}'];renderWorkout()"><span class="harr${open?" open":""}">▶</span><span>история${hist.length?` (${hist.length})`:""}</span></button>${open?`<div class="hlist">${entries}</div>`:""}</div>`;
}

// ── экран тренировки ────────────────────────────────────────────────────────
function fmtRest(sec){sec=Math.round(sec||0);return Math.floor(sec/60)+":"+pad(sec%60);}
function groupTitle(g,count){
  if(g==="K")return`Круг — по очереди, почти без отдыха <span>· 2–3 раунда</span>`;
  return`Суперсет ${esc(g)} — чередуй подходы <span>· ${Array.from({length:count},(_,i)=>g+(i+1)).join(" → ")} → отдых</span>`;
}
function exCardHTML(pid,idx,item0,label){
  const w=getW(pid);
  const exId=itemExId(pid,idx,item0);
  const item=effItem(item0,exId);
  const ex=getEx(exId);if(!ex)return`<div class="card"><div class="sk">упражнение не найдено: ${esc(exId)}</div></div>`;
  const sets=getSets(pid,exId,item.sets);
  const pr=calcPR(exId);
  const lbs=isLbs(exId);
  const unitBtn=!isRepsOnly(ex)&&!ex.bodyweight?`<button class="bxs${lbs?" on":""}" onclick="toggleUnit('${exId}')">${lbs?"ф":"кг"}</button>`:"";
  const techBtn=`<button class="bxs${techOpen[exId]?" on":""}" onclick="toggleTech('${exId}')">ⓘ</button>`;
  // варианты
  let vch="";
  if(item.alts&&item.alts.length){
    vch=`<div class="vchips">`+[item0.id,...item0.alts].map(id=>{const e=getEx(id);return e?`<button class="vchip${id===exId?" on":""}" onclick="setVariant('${pid}',${idx},'${id}')">${esc(e.name)}</button>`:"";}).join("")+`</div>`;
  }
  // инфо
  const pi=progInfo(item,exId,w.date);
  let infos="";
  if(ex.note)infos+=`<div class="info mynote">📝 ${esc(ex.note)}</div>`;
  if(item.repMax)infos+=`<div class="info"><b>план:</b> ${item.sets||"?"} × ${item.repMin&&item.repMin!==item.repMax?item.repMin+"–":""}${item.repMax}${ex.defaultUnit==="сек"?" сек":""} · отдых ${fmtRest(item.rest||90)}</div>`;
  if(pi.last)infos+=`<div class="info"><b>прошлый раз</b> ${pi.last}</div>`;
  if(pi.hint)infos+=`<div class="info hint ${pi.cls||""}">${esc(pi.hint)}</div>`;
  let binfo="";
  const base=baseW(exId);
  if(ex.hasBar&&base>0&&!lbs)binfo=`<div class="binfo">вводи вес блинов · гриф ${base} кг прибавится сам</div>`;
  // строки
  const ph=placeholders(exId,w.date);
  let wn=0,wun=0;
  const rows=sets.map((s,i)=>{const p=s.wu?ph.wu[wun++]:ph.work[wn++];return setRowHTML({pid,exId,i,s,ph:p||{},workNo:s.wu?0:wn});}).join("");
  return`<div class="card" id="card-${idx}">
    <div class="ch"><div class="cn">${label?`<span class="gtag">${label}</span>`:""}${esc(ex.name)}</div><div class="ca">${pr?`<span class="badge">PR ${pr}</span>`:""}${unitBtn}${techBtn}</div></div>
    ${vch}
    ${techOpen[exId]?techHTML(exId):""}
    <div class="infos">${infos}</div>
    ${binfo}
    ${headHTML(ex,exId)}
    <div id="sets-${exId}">${rows}</div>
    <div class="addrow"><button class="bxs" onclick="addSet('${pid}','${exId}',false)">+ подход</button><button class="bxs" onclick="addSet('${pid}','${exId}',true)">+ разминка</button></div>
    ${buildVol(exId,sets,w.date)}
    ${buildHist(exId)}
  </div>`;
}
function ssCardHTML(pid,idx,item){
  const ss=getSS(item.id);if(!ss)return"";
  const w=getW(pid);
  const rounds=getSSRounds(pid,item.id);
  let inner="";
  rounds.forEach((round,ri)=>{
    inner+=`<div style="${ri>0?"margin-top:10px;padding-top:10px;border-top:1px solid var(--border);":""}"><div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:6px;">Раунд ${ri+1}</div>`;
    (ss.exIds||[]).forEach(exId=>{
      const ex=getEx(exId);if(!ex)return;
      const s=round[exId]||newSet(false);
      inner+=`<div class="ss-ex"><div class="ss-ex-name">${esc(ex.name)}</div>${headHTML(ex,exId)}${setRowHTML({pid,exId,i:ri,s,ssId:item.id,workNo:ri+1})}</div>`;
    });
    inner+=`</div>`;
  });
  return`<div class="ss-card"><div class="ss-header"><span class="ss-label">суперсет · ${esc(ss.name)}</span><button class="bxs" onclick="addSSRound('${pid}','${item.id}')">+ раунд</button></div>
    <div class="ss-body">${inner}${buildVolSS(item.id,rounds,w.date)}${buildHistSS(item.id)}</div></div>`;
}
function backupBanner(){
  const n=Object.values(D.history).reduce((a,h)=>a+h.length,0);
  if(!n)return"";
  const lb=D.settings.lastBackup;
  const days=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(days!==null&&days<7)return"";
  return`<div class="banner"><span>${days===null?"Резервной копии ещё нет. Данные теперь только на телефоне.":"Последняя резервная копия — "+days+" дн. назад."}</span><button class="ba sm" onclick="doBackup()">сделать</button></div>`;
}
function renderWorkout(){
  const pg=document.getElementById("pg-workout");
  const pr=getPr(curPreset);
  const chips=D.presets.map(p=>`<button class="chip${p.id===curPreset?" on":""}" onclick="switchPreset('${p.id}')">${esc(p.name)}</button>`).join("");
  if(!pr){pg.innerHTML=`<div class="chips">${chips}</div><div class="sk">Выбери тренировку</div>`;return;}
  const w=getW(curPreset);
  if(!w.started&&!w.dateManual&&!workoutHasData(w)&&w.date!==today())w.date=today();
  let html=(FIRST_MIGRATION?`<div class="banner" style="color:var(--accent);border-color:rgba(200,240,96,.3);background:rgba(200,240,96,.06)"><span>Новая версия. История перенесена, старые пресеты убраны в настройки. Синхронизации больше нет — делай резервную копию.</span><button class="ba sm" onclick="FIRST_MIGRATION=false;renderWorkout()">ок</button></div>`:"")+backupBanner();
  html+=`<div class="chips">${chips}</div>
  <div class="drow"><span class="dlbl">дата:</span><input type="date" class="dinp" value="${w.date}" onchange="const w=getW('${curPreset}');w.date=this.value||today();w.dateManual=true;sl();renderWorkout()"></div>`;
  let totalVol=0,workSets=0;
  const items=pr.items||[];
  let i=0;
  while(i<items.length){
    const item=items[i];
    if(item.type==="ex"&&item.group){
      const g=item.group;let j=i;const grp=[];
      while(j<items.length&&items[j].type==="ex"&&items[j].group===g){grp.push(j);j++;}
      html+=`<div class="grp"><div class="grp-h">${groupTitle(g,grp.length)}</div>`;
      grp.forEach((k,n)=>{html+=exCardHTML(curPreset,k,items[k],g==="K"?String(n+1):g+(n+1));});
      html+=`</div>`;i=j;
    }else if(item.type==="ex"){html+=exCardHTML(curPreset,i,item,"");i++;}
    else if(item.type==="ss"){html+=ssCardHTML(curPreset,i,item);i++;}
    else i++;
  }
  items.forEach((item,k)=>{
    if(item.type==="ex"){const id=itemExId(curPreset,k,item);const s=w.sets[id]||[];totalVol+=calcVol(id,s);workSets+=s.filter(isWork).length;}
    else if(item.type==="ss"){totalVol+=calcVolSS(item.id,w.ssSets[item.id]||[]);}
  });
  const mins=w.started?Math.round((Date.now()-w.started)/60000):null;
  html+=`<div class="total-row"><span class="total-item">рабочих подходов: <span>${workSets}</span></span><span class="total-item">объём: <span>${Math.round(totalVol)}</span></span>${mins!==null?`<span class="total-item">идёт: <span>${mins} мин</span></span>`:""}</div>
  <div class="daynote"><div class="tsec" style="margin-top:4px">Заметка к тренировке</div><textarea class="tarea" placeholder="самочувствие, сон, что было тяжело…" oninput="getW('${curPreset}').note=this.value;sl()">${esc(w.note)}</textarea></div>`;
  pg.innerHTML=html;
  updateHeader();
}

// ── действия на тренировке ──────────────────────────────────────────────────
function switchPreset(id){curPreset=id;D.lastPreset=id;sl();renderWorkout();window.scrollTo(0,0);}
function setVariant(pid,idx,id){getW(pid).variant[idx]=id;sl();renderWorkout();}
function toggleUnit(exId){D.unitPref[exId]=isLbs(exId)?"kg":"lbs";sl();renderWorkout();}
function updSet(pid,exId,i,field,val,fromLbs){
  const s=getSets(pid,exId);if(!s[i])return;
  s[i][field]=(field==="weight"&&fromLbs&&has(val))?lbsToKg(num(val)):val;
  sl();
  if(field==="band")renderWorkout();else refreshVol(exId);
}
function refreshVol(exId){const el=document.getElementById("vol-"+exId);if(el)el.outerHTML=buildVol(exId,getSets(curPreset,exId),getW(curPreset).date);}
function updSSSet(pid,ssId,ri,exId,field,val,fromLbs){
  const r=getSSRounds(pid,ssId);if(!r[ri])return;
  if(!r[ri][exId])r[ri][exId]=newSet(false);
  r[ri][exId][field]=(field==="weight"&&fromLbs&&has(val))?lbsToKg(num(val)):val;
  sl();const el=document.getElementById("vol-"+ssId);if(el)el.outerHTML=buildVolSS(ssId,r,getW(pid).date);
}
function addSet(pid,exId,wu){
  const s=getSets(pid,exId);
  if(wu){const firstWork=s.findIndex(x=>!x.wu);const at=firstWork<0?s.length:firstWork;s.splice(at,0,newSet(true));}
  else{const prev=[...s].reverse().find(x=>!x.wu);const ns=newSet(false);if(prev&&getEx(exId)?.usesBand)ns.band=prev.band||"";s.push(ns);}
  sl();renderWorkout();
}
function delSet(pid,exId,i){const s=getSets(pid,exId);if(s.length<=1){s[0]=newSet(false);}else s.splice(i,1);sl();renderWorkout();}
function toggleWu(pid,exId,i){const s=getSets(pid,exId);if(!s[i])return;s[i].wu=!s[i].wu;sl();renderWorkout();}
function restFor(pid,exId,wu){
  if(wu)return 60;
  const pr=getPr(pid);const it=(pr?.items||[]).find((x,k)=>x.type==="ex"&&itemExId(pid,k,x)===exId);
  return it?effItem(it,exId).rest||90:90;
}
function doneSet(pid,exId,i){
  unlockAudio();
  const sets=getSets(pid,exId);const s=sets[i];if(!s)return;
  if(s.done){s.done=false;sl();renderWorkout();return;}
  // пустые поля → как в прошлый раз
  const w=getW(pid);const ph=placeholders(exId,w.date);
  let wn=0,wun=0,p=null;
  for(let k=0;k<=i;k++){const x=sets[k];if(x.wu){if(k===i)p=ph.wu[wun];wun++;}else{if(k===i)p=ph.work[wn];wn++;}}
  const ex=getEx(exId);
  if(p){
    if(!has(s.reps)&&has(p.reps))s.reps=String(num(p.reps));
    if(!ex.bodyweight&&!isRepsOnly(ex)&&!has(s.weight)&&has(p.weight))s.weight=String(num(p.weight));
    if(ex.bodyweight&&!ex.usesBand&&!has(s.adj)&&has(p.adj))s.adj=String(num(p.adj));
  }
  if(!has(s.reps)){showToast("впиши повторы");return;}
  s.done=true;
  if(!w.started)w.started=Date.now();
  sl();
  startRest(restFor(pid,exId,s.wu),ex.name);
  renderWorkout();
}
function doneSS(pid,ssId,ri,exId){
  unlockAudio();
  const r=getSSRounds(pid,ssId);const s=r[ri]&&r[ri][exId];if(!s)return;
  s.done=!s.done;const w=getW(pid);if(s.done&&!w.started)w.started=Date.now();
  sl();if(s.done)startRest(90,getEx(exId)?.name||"");renderWorkout();
}
function addSSRound(pid,ssId){const r=getSSRounds(pid,ssId);const ss=getSS(ssId);const o={};(ss?.exIds||[]).forEach(id=>o[id]=newSet(false));r.push(o);sl();renderWorkout();}
function delSSRound(pid,ssId,i){const r=getSSRounds(pid,ssId);if(r.length<=1)return;r.splice(i,1);sl();renderWorkout();}

function collectEntries(pid){
  const pr=getPr(pid);const w=getW(pid);const out=[];
  (pr?.items||[]).forEach((item,idx)=>{
    if(item.type==="ex"){
      const exId=itemExId(pid,idx,item);
      if(out.some(o=>o.type==="ex"&&o.id===exId))return;
      const filled=(w.sets[exId]||[]).filter(s=>num(s.reps)>0);
      if(filled.length)out.push({type:"ex",id:exId,sets:filled.map(s=>({weight:s.weight,reps:s.reps,adj:s.adj,band:s.band||"",wu:!!s.wu,baseSnap:baseW(exId)}))});
    }else if(item.type==="ss"){
      const ss=getSS(item.id);const rounds=(w.ssSets[item.id]||[]).filter(r=>Object.values(r).some(s=>num(s.reps)>0));
      if(rounds.length)out.push({type:"ss",id:item.id,rounds:rounds.map(r=>{const o={};(ss?.exIds||[]).forEach(id=>{const s=r[id]||{};o[id]={weight:s.weight||"",reps:s.reps||"",adj:s.adj||"",baseSnap:baseW(id)};});return o;})});
    }
  });
  return out;
}
function saveDay(){
  const w=getW(curPreset);const date=w.date||today();
  const entries=collectEntries(curPreset);
  if(!entries.length){showToast("нет заполненных подходов");return;}
  const already=entries.some(e=>(e.type==="ex"?getHist(e.id):getSSHist(e.id)).some(h=>h.date===date));
  if(already){showModal("Перезаписать?",`За ${date} уже есть записи этих упражнений. Заменить их?`,[{label:"Перезаписать",cls:"danger",fn:"doSaveDay()"},{label:"Отмена",fn:"closeModal()"}]);return;}
  doSaveDay();
}
function upsertHist(arr,entry){const i=arr.findIndex(h=>h.date===entry.date);if(i>=0)arr[i]=entry;else arr.push(entry);arr.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function doSaveDay(){
  closeModal();
  const w=getW(curPreset);const date=w.date||today();
  const entries=collectEntries(curPreset);
  let vol=0,sets=0,lines=[];
  entries.forEach(e=>{
    if(e.type==="ex"){
      if(!D.history[e.id])D.history[e.id]=[];
      upsertHist(D.history[e.id],{date,sets:e.sets});
      const v=calcVol(e.id,e.sets);vol+=v;const n=e.sets.filter(isWork).length;sets+=n;
      lines.push(`${getEx(e.id)?.name}: ${n} подх.`);
    }else{
      if(!D.ssHistory[e.id])D.ssHistory[e.id]=[];
      upsertHist(D.ssHistory[e.id],{date,rounds:e.rounds});vol+=calcVolSS(e.id,e.rounds);
      lines.push(`${getSS(e.id)?.name}: ${e.rounds.length} раунд.`);
    }
  });
  if(has(w.note))D.dayNotes[date]=w.note;
  const mins=w.started?Math.round((Date.now()-w.started)/60000):null;
  D.workouts[curPreset]={date:today(),sets:{},ssSets:{},variant:w.variant||{},started:null,note:""};
  stopRest();sl();
  showModal("Готово, записано 💪",`${date}${mins!==null?" · "+mins+" мин":""}\nРабочих подходов: ${sets} · объём: ${Math.round(vol)}\n\n${lines.join("\n")}`,[{label:"Закрыть",fn:"closeModal()"}]);
  renderWorkout();
}
function askClearDay(){showModal("Очистить тренировку?","Все введённые сейчас подходы удалятся. Сохранённая история не пострадает.",[{label:"Очистить",cls:"danger",fn:"clearDay()"},{label:"Отмена",fn:"closeModal()"}]);}
function clearDay(){closeModal();const w=getW(curPreset);D.workouts[curPreset]={date:today(),sets:{},ssSets:{},variant:w.variant||{},started:null,note:""};stopRest();sl();renderWorkout();}

let TM={end:0,total:0,label:"",iv:null,endShown:0};
let AC=null,WL=null;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function beep(){
  try{if(!AC)return;const t=AC.currentTime;
    [0,0.28,0.56].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=880;o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.5,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2);o.start(t+d);o.stop(t+d+0.22);});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([250,120,250]);}catch(e){}
}
async function wakeOn(){try{if("wakeLock" in navigator&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null;});}}catch(e){}}
function wakeOff(){try{WL&&WL.release();}catch(e){}WL=null;}
function startRest(sec,label){
  TM.end=Date.now()+sec*1000;TM.total=sec;TM.label=label||"";TM.endShown=0;
  if(!TM.iv)TM.iv=setInterval(tickRest,250);
  wakeOn();tickRest();
}
function addRest(s){if(!TM.end)return;TM.end+=s*1000;TM.total+=s;TM.endShown=0;tickRest();}
function stopRest(){TM.end=0;TM.endShown=0;if(TM.iv){clearInterval(TM.iv);TM.iv=null;}document.getElementById("tbar").style.display="none";document.getElementById("tbox").classList.remove("end");wakeOff();}
function tickRest(){
  const bar=document.getElementById("tbar"),box=document.getElementById("tbox"),txt=document.getElementById("ttxt"),fill=document.getElementById("tfill");
  if(!TM.end||curPage!=="workout"){bar.style.display="none";if(!TM.end)return;}
  else bar.style.display="block";
  const left=Math.ceil((TM.end-Date.now())/1000);
  if(left>0){
    box.classList.remove("end");
    txt.innerHTML=`отдых ${fmtRest(left)} <small>· ${esc(TM.label)}</small>`;
    fill.style.width=Math.max(0,Math.min(100,100*(1-left/TM.total)))+"%";
  }else{
    if(!TM.endShown){TM.endShown=Date.now();beep();box.classList.add("end");txt.textContent="Отдых закончился — подход!";fill.style.width="100%";}
    if(Date.now()-TM.endShown>6000)stopRest();
  }
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(TM.end)wakeOn();tickRest();updateHeader();}});
function updateHeader(){
  const w=D.workouts[curPreset];const el=document.getElementById("htime");
  if(w&&w.started){const m=Math.round((Date.now()-w.started)/60000);el.textContent="⏱ "+m+" мин";}
  else el.textContent="";
}

// ── данные: резервная копия, экспорт, история ───────────────────────────────
function countEntries(d){return Object.values(d.history||{}).reduce((a,h)=>a+(h?.length||0),0)+Object.values(d.ssHistory||{}).reduce((a,h)=>a+(h?.length||0),0);}
function allDates(){const s=new Set();Object.values(D.history).forEach(h=>h.forEach(e=>{if((e.sets||[]).some(x=>num(x.reps)>0))s.add(e.date);}));Object.values(D.ssHistory).forEach(h=>h.forEach(e=>s.add(e.date)));return[...s].sort().reverse();}
function renderData(){
  const lb=D.settings.lastBackup;
  const days=lb?Math.floor((Date.now()-lb)/864e5):null;
  const standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  const dates=allDates();
  let html=`<div class="ss-sec"><div class="st">Резервная копия</div>
    <div class="expnote">Все данные хранятся только в памяти этого телефона. Копия — один файл: сохрани его в «Файлы» или iCloud.<br>
    <b>Последняя копия:</b> ${lb?(days===0?"сегодня":days+" дн. назад"):"<span class='warnline'>ещё не делалась</span>"} · <b>записей:</b> ${countEntries(D)} · <b>тренировок:</b> ${dates.length}<br>
    <b>Режим:</b> ${standalone?"<span class='okline'>приложение с экрана «Домой»</span>":"<span class='warnline'>вкладка браузера — после долгого перерыва Safari может стереть данные, копия обязательна</span>"}${STORAGE_PERSIST===true?" · <span class='okline'>хранилище постоянное</span>":""}</div>
    <button class="expbtn primary" onclick="doBackup()">💾 Сохранить резервную копию</button>
    <button class="expbtn" onclick="document.getElementById('restore-inp').click()">📂 Восстановить из копии</button>
  </div>
  <div class="ss-sec"><div class="st">История по датам</div>
    <select class="esel" onchange="renderExpPreview(this.value)"><option value="">— выбери дату —</option>${dates.map(d=>`<option value="${d}">${d}</option>`).join("")}</select>
    <div id="exp-preview"></div>
  </div>
  <div class="ss-sec"><div class="st">Экспорт</div>
    <button class="expbtn" onclick="exportCSV()">📥 Вся история в CSV (для таблиц и для меня)</button>
  </div>
  <div class="ss-sec"><div class="st">Старая синхронизация</div>
    <div class="expnote">Если на телефоне вдруг не хватает старых записей — можно один раз подтянуть их из Google-таблицы. Недостающие даты добавятся, существующие не изменятся.</div>
    <button class="expbtn" onclick="importGoogle()">☁️ Подтянуть из Google-таблицы</button>
  </div>`;
  document.getElementById("pg-data").innerHTML=html;
}
function renderExpPreview(date){
  const el=document.getElementById("exp-preview");if(!date){el.innerHTML="";return;}
  let html=`<div class="exp-preview"><div style="font-size:13px;font-weight:500;margin-bottom:10px;">${date}</div>`;
  D.exercises.forEach(ex=>{const h=getHist(ex.id).find(h=>h.date===date);if(!h||!h.sets.some(s=>num(s.reps)>0))return;
    html+=`<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:500;">${esc(ex.name)} <span style="font-size:11px;color:var(--text3);font-weight:400;">${fmtVol(calcVol(ex.id,h.sets),ex)}</span></div>
      <div class="hs">${h.sets.filter(s=>num(s.reps)>0).map(s=>fmtSet(ex.id,s)).join(" · ")||"—"}</div>
      <button class="ba sm ghost" style="margin-top:4px" onclick="openEditHist('ex','${ex.id}','${date}')">редактировать</button></div>`;});
  D.supersets.forEach(ss=>{const h=getSSHist(ss.id).find(h=>h.date===date);if(!h)return;
    html+=`<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:500;">${esc(ss.name)}</div><div class="hs">${h.rounds.map((r,i)=>`${i+1}: `+(ss.exIds||[]).map(id=>fmtSet(id,r[id]||{})).join(" + ")).join("  ")}</div></div>`;});
  if(D.dayNotes[date])html+=`<div class="info mynote">📝 ${esc(D.dayNotes[date])}</div>`;
  html+=`<button class="ba sm danger" style="margin-top:6px" onclick="askDelDay('${date}')">удалить всю тренировку</button></div>`;
  el.innerHTML=html;
}
async function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}
  catch(e){if(e&&e.name==="AbortError")return false;}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  return true;
}
async function doBackup(){
  const blob=new Blob([JSON.stringify(D)],{type:"application/json"});
  const ok=await shareOrDownload(blob,"gym_backup_"+today()+".json");
  if(ok){D.settings.lastBackup=Date.now();sl();showToast("копия готова");if(curPage==="data")renderData();else renderWorkout();}
}
function onRestoreFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.exercises)||!d.history)throw 0;
      PENDING_RESTORE=d;
      showModal("Восстановить из копии?",`Файл: ${esc(f.name)}\nЗаписей в копии: ${countEntries(d)} (сейчас на телефоне: ${countEntries(D)})\n\nТекущие данные будут заменены копией. На всякий случай текущее состояние тоже запомнится.`,[{label:"Восстановить",cls:"danger",fn:"doRestore()"},{label:"Отмена",fn:"PENDING_RESTORE=null;closeModal()"}]);
    }catch(e){showToast("это не файл резервной копии");}
  };
  r.readAsText(f);inp.value="";
}
function doRestore(){
  if(!PENDING_RESTORE)return;
  try{localStorage.setItem("gym_v12_before_restore",JSON.stringify(D));}catch(e){}
  D=migrate(PENDING_RESTORE);PENDING_RESTORE=null;D.settings.lastBackup=Date.now();
  curPreset=pickStartPreset();sl();closeModal();renderAll();showToast("восстановлено");
}
function exportCSV(){
  const rows=["дата,тип,упражнение,подход,разминка,вес(кг),резинка,повт/сек,объём"];
  D.exercises.forEach(ex=>getHist(ex.id).forEach(h=>{let n=0;h.sets.forEach(s=>{if(!(num(s.reps)>0))return;n++;
    const w=isRepsOnly(ex)&&!ex.bodyweight?"":+effW(ex.id,s).toFixed(2);
    rows.push([h.date,"упражнение",`"${ex.name}"`,n,s.wu?1:0,w,s.band?`"${s.band}"`:"",num(s.reps),s.wu?0:Math.round(calcVol(ex.id,[s]))].join(","));});}));
  D.supersets.forEach(ss=>getSSHist(ss.id).forEach(h=>h.rounds.forEach((r,ri)=>(ss.exIds||[]).forEach(id=>{const ex=getEx(id);if(!ex)return;const s=r[id]||{};if(!(num(s.reps)>0))return;
    rows.push([h.date,"суперсет",`"${ss.name} — ${ex.name}"`,ri+1,0,+effW(id,s).toFixed(2),"",num(s.reps),Math.round(effW(id,s)*num(s.reps))].join(","));}))));
  shareOrDownload(new Blob(["﻿"+rows.join("\n")],{type:"text/csv"}),"gym_history.csv");
}
async function importGoogle(){
  showToast("загрузка из Google…");
  const get=async k=>{try{const r=await fetch(GS+"?action=get&key="+encodeURIComponent(k));const j=await r.json();return j.value?JSON.parse(j.value):null;}catch(e){return undefined;}};
  const exs=await get("exercises");
  if(exs===undefined){showModal("Нет связи","Не удалось достучаться до Google-таблицы. Попробуй позже или с другим интернетом.",[{label:"Ок",fn:"closeModal()"}]);return;}
  const sss=(await get("supersets"))||[];
  const exList=[...(exs||[])];D.exercises.forEach(e=>{if(!exList.some(x=>x.id===e.id))exList.push(e);});
  const ssList=[...sss];D.supersets.forEach(s=>{if(!ssList.some(x=>x.id===s.id))ssList.push(s);});
  const [hs,sh]=await Promise.all([Promise.all(exList.map(e=>get("hist2_"+e.id))),Promise.all(ssList.map(s=>get("ssHist_"+s.id)))]);
  let added=0;
  exList.forEach((e,i)=>{const h=hs[i];if(!Array.isArray(h)||!h.length)return;
    if(!getEx(e.id)){const c=clone(e);delete c.kcalFactor;D.exercises.push(c);}
    const arr=D.history[e.id]||(D.history[e.id]=[]);h.forEach(en=>{if(en&&en.date&&!arr.some(x=>x.date===en.date)&&(en.sets||[]).some(s=>num(s.reps)>0)){arr.push(en);added++;}});});
  ssList.forEach((s,i)=>{const h=sh[i];if(!Array.isArray(h)||!h.length)return;
    if(!getSS(s.id)){const c=clone(s);delete c.kcalFactor;D.supersets.push(c);}
    const arr=D.ssHistory[s.id]||(D.ssHistory[s.id]=[]);h.forEach(en=>{if(en&&en.date&&!arr.some(x=>x.date===en.date)){arr.push(en);added++;}});});
  D=migrate(D);sl();renderAll();
  showModal("Готово",added?`Добавлено записей: ${added}.`:"Всё уже было на телефоне — ничего добавлять не пришлось.",[{label:"Ок",fn:"closeModal()"}]);
}

// ── редактирование истории ──────────────────────────────────────────────────
let EDIT_BUF=null;
function openEditHist(type,id,date){
  if(type==="ex"){
    const ex=getEx(id);const h=getHist(id).find(h=>h.date===date);if(!ex||!h)return;
    EDIT_BUF={type,id,date,sets:clone(h.sets)};
    const rows=EDIT_BUF.sets.map((s,i)=>{
      let f1="";
      if(ex.usesBand)f1=`<select onchange="EDIT_BUF.sets[${i}].band=this.value"><option value="">без</option>${(D.settings.bands||[]).concat(s.band&&!(D.settings.bands||[]).includes(s.band)?[s.band]:[]).map(b=>`<option${s.band===b?" selected":""}>${esc(b)}</option>`).join("")}</select>`;
      if(ex.bodyweight)f1+=`<input type="number" step="0.5" placeholder="±кг" value="${esc(s.adj??"")}" oninput="EDIT_BUF.sets[${i}].adj=this.value">`;
      else if(!isRepsOnly(ex))f1=`<input type="number" step="0.5" placeholder="кг" value="${esc(s.weight??"")}" oninput="EDIT_BUF.sets[${i}].weight=this.value">`;
      return`<div class="mrow"><span style="width:18px;color:var(--text3);font-family:var(--mono)">${i+1}</span>${f1}<input type="number" step="1" placeholder="повт" value="${esc(s.reps??"")}" oninput="EDIT_BUF.sets[${i}].reps=this.value"><label><input type="checkbox"${s.wu?" checked":""} onchange="EDIT_BUF.sets[${i}].wu=this.checked">разм.</label></div>`;
    }).join("");
    const note=ex.hasBar?`<div class="note">вес без грифа (гриф на момент записи: ${h.sets[0]?.baseSnap??baseW(id)} кг)</div>`:"";
    showModal(`${esc(ex.name)} · ${date}`,"",[{label:"Сохранить",cls:"primary",fn:"saveEditHist()"},{label:"Отмена",fn:"EDIT_BUF=null;closeModal()"}]);
    document.querySelector(".modal-text").innerHTML=note+rows+`<div class="note">пустые повторы = подход удалится</div>`;
  }else{
    const ss=getSS(id);const h=getSSHist(id).find(h=>h.date===date);if(!ss||!h)return;
    EDIT_BUF={type,id,date,rounds:clone(h.rounds)};
    const rows=EDIT_BUF.rounds.map((r,ri)=>(ss.exIds||[]).map(eid=>{const s=r[eid]||{};const ex=getEx(eid);
      return`<div class="mrow"><span style="font-size:11px;color:var(--text3);width:110px">${ri+1}. ${esc(ex?.name||eid)}</span><input type="number" step="0.5" placeholder="вес" value="${esc((ex?.bodyweight?s.adj:s.weight)??"")}" oninput="EDIT_BUF.rounds[${ri}]['${eid}'].${ex?.bodyweight?"adj":"weight"}=this.value"><input type="number" step="1" placeholder="повт" value="${esc(s.reps??"")}" oninput="EDIT_BUF.rounds[${ri}]['${eid}'].reps=this.value"></div>`;}).join("")).join("");
    showModal(`${esc(ss.name)} · ${date}`,"",[{label:"Сохранить",cls:"primary",fn:"saveEditHist()"},{label:"Отмена",fn:"EDIT_BUF=null;closeModal()"}]);
    document.querySelector(".modal-text").innerHTML=rows;
  }
}
function saveEditHist(){
  if(!EDIT_BUF)return;const b=EDIT_BUF;
  if(b.type==="ex"){const h=getHist(b.id).find(h=>h.date===b.date);if(h){h.sets=b.sets.filter(s=>num(s.reps)>0);if(!h.sets.length)D.history[b.id]=getHist(b.id).filter(x=>x!==h);}}
  else{const h=getSSHist(b.id).find(h=>h.date===b.date);if(h)h.rounds=b.rounds;}
  EDIT_BUF=null;closeModal();sl();showToast("история обновлена");renderAll();
}
function askDelHist(type,id,date){
  showModal("Удалить запись?",`${date}: удалить только это упражнение или всю тренировку за день?`,[
    {label:"Только это",cls:"danger",fn:`delHistEntry('${type}','${id}','${date}')`},
    {label:"Весь день",cls:"danger",fn:`delWholeDay('${date}')`},
    {label:"Отмена",fn:"closeModal()"}]);
}
function askDelDay(date){showModal("Удалить тренировку?",`Все записи за ${date} удалятся.`,[{label:"Удалить",cls:"danger",fn:`delWholeDay('${date}')`},{label:"Отмена",fn:"closeModal()"}]);}
function delHistEntry(type,id,date){closeModal();if(type==="ex")D.history[id]=getHist(id).filter(h=>h.date!==date);else D.ssHistory[id]=getSSHist(id).filter(h=>h.date!==date);sl();showToast("удалено");renderAll();}
function delWholeDay(date){closeModal();Object.keys(D.history).forEach(k=>D.history[k]=D.history[k].filter(h=>h.date!==date));Object.keys(D.ssHistory).forEach(k=>D.ssHistory[k]=D.ssHistory[k].filter(h=>h.date!==date));delete D.dayNotes[date];sl();showToast("тренировка удалена");renderAll();}

// ── общее ───────────────────────────────────────────────────────────────────
function showModal(title,text,btns){
  const b=btns.map(x=>`<button class="ba${x.cls?" "+x.cls:""}" onclick="${x.fn}">${x.label}</button>`).join("");
  document.getElementById("modal-root").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-title">${title}</div><div class="modal-text">${text}</div><div class="modal-btns">${b}</div></div></div>`;
}
function closeModal(){document.getElementById("modal-root").innerHTML="";}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
function showPage(name){
  curPage=name;
  if(name!=="settings"){editPreset=null;editEx=null;showNewExForm=false;}
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nb").forEach((b,i)=>b.classList.toggle("active",["workout","settings","data"][i]===name));
  document.getElementById("pg-"+name).classList.add("active");
  document.getElementById("bbar").style.display=name==="workout"?"flex":"none";
  if(name==="settings")renderSettings();
  if(name==="data")renderData();
  if(name==="workout")renderWorkout();
  tickRest();
  window.scrollTo(0,0);
}
function renderAll(){if(curPage==="settings")renderSettings();else if(curPage==="data")renderData();renderWorkout();}
async function askPersist(){try{if(navigator.storage&&navigator.storage.persist){STORAGE_PERSIST=(await navigator.storage.persisted())||(await navigator.storage.persist());}}catch(e){}}
document.addEventListener("touchend",unlockAudio,{once:true});
askPersist();
renderWorkout();
</script>
